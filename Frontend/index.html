<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <title>User Search</title>
</head>
<body>
  <main>
    <label>Search for Users</label> 
    <br><br>
     <div> 
        <input placeholder="search by..." id="general-input">
        <br>
        <button id="userid-btn">Username</button>
        <button id="firstname-btn">First Name</button>
        <button id="lastname-btn">Last Name</button>
        <br>
        <br>
        <label>Or search between: </label>
        <br>
        <input placeholder="lower bound" id="lowerbound-input">
        <input placeholder="upper bound" id="upperbound-input">
        <br>
        <button id="salary-btn">Salary</button>
        <button id="age-btn">Age</button>

        <br><br>
        <label>Or search for: </label>
        <br>
        <input placeholder="enter user id..." id="userid-input">
        <br>
        <button id="registered-after-btn">Users who registered after</button>
        <br>
        <button id="registered-same-btn">Users who registered on the same date</button>
        <br><br>
        <label>Extra search options:</label>
        <br>
        <button id="never-btn">Users who never signed in</button>
        <br>
        <button id="today-btn">Users who registered today</button>
        <br><br>

     </div>

     
    <a href="signin.html">To signin</a>
    <br>
    <br>
    <br>

     <table id="table">
         <thead>
             <th>Username |</th>
             <th>First Name |</th>
             <th>Last Name |</th>
             <th>Salary |</th>
             <th>Age |</th>  
             <th>Registered |</th>
             <th>Last Sign In |</th>    
         </thead>
         <tbody></tbody>
     </table>

     <section hidden id="update-row">
         <label>Name:</label>
         <input type="text" id="update-name-input">
         <button id="update-row-btn" value="">Update</button>
    </section>
</main>
<script src="index.js"></script>
</body>
</html>
